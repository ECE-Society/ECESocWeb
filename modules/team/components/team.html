<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>
    <link rel="stylesheet" href="team.css">
</head>
<body>
    <div id="background-canvas"></div>
    <div class="overlay"></div>
    <section class="team-section">
        <div class="container">
            <h2 class="section-title">Our Team</h2>
            <div class="team-grid">
                <div class="team-card">
                    <img src="https://via.placeholder.com/150" alt="John Doe">
                    <h3>John Doe</h3>
                    <p>CEO</p>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">Twitter</a>
                        <a href="#">Email</a>
                    </div>
                </div>
                <div class="team-card">
                    <img src="https://via.placeholder.com/150" alt="Jane Smith">
                    <h3>Jane Smith</h3>
                    <p>CTO</p>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">Twitter</a>
                        <a href="#">Email</a>
                    </div>
                </div>
                <div class="team-card">
                    <img src="https://via.placeholder.com/150" alt="Bob Johnson">
                    <h3>Bob Johnson</h3>
                    <p>Designer</p>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">Twitter</a>
                        <a href="#">Email</a>
                    </div>
                </div>
                <div class="team-card">
                    <img src="https://via.placeholder.com/150" alt="Alice Brown">
                    <h3>Alice Brown</h3>
                    <p>Developer</p>
                    <div class="social-links">
                        <a href="#">LinkedIn</a>
                        <a href="#">Twitter</a>
                        <a href="#">Email</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="team.js"></script>
</body>
</html>
